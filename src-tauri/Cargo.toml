[package]
name = "velocity-console"
version = "0.1.0"
description = "Ledger-first SSH/SFTP client for managing multiple servers"
authors = ["Trex099"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "velocity_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["tauri-app"]
# Full Tauri application with GUI (requires system GTK/WebKit libs)
tauri-app = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-sql", "dep:tauri-plugin-shell"]
# Headless mode for CI testing (no GUI dependencies)
headless = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Framework (optional - only for full desktop app)
tauri = { version = "2", features = ["tray-icon", "devtools"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-sql = { version = "2", features = ["sqlite"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }

# Async Runtime
tokio = { version = "1", features = ["full", "sync", "time"] }

# SSH/SFTP - Verified 2026-01-11
# Note: russh 0.56 includes key handling via ssh-key crate
russh = { version = "0.56", features = ["aws-lc-rs"] }
russh-sftp = "2.1"

# Credentials - OS Keyring (sync-secret-service for Linux DBus Secret Service)
keyring = { version = "3.6", features = ["sync-secret-service"] }

# File Watching
async-watcher = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Security
zeroize = { version = "1.8", features = ["derive"] }

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
which = "7"
dirs = "6"

# Database - SQLite with bundled library for cross-platform builds
rusqlite = { version = "0.32", features = ["bundled"] }
