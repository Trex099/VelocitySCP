# Velocity Console - Strict Rust Configuration
# All warnings are errors. No exceptions.

[build]
rustflags = [
    "-D", "warnings",              # Treat all warnings as errors
    "-D", "clippy::all",           # Enable all clippy lints
    "-D", "clippy::pedantic",      # Enable pedantic lints for extra strictness
    "-A", "clippy::module_name_repetitions",  # Allow module_name_repetitions (common in Tauri)
    "-A", "clippy::must_use_candidate",       # Allow missing #[must_use] on simple functions
]

[alias]
# Quick commands for development workflow
lint = "clippy --all-targets --all-features"
fmt-check = "fmt --all -- --check"
test-all = "test --all-features --workspace"
doc = "doc --no-deps --document-private-items"
